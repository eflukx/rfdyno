[workspace]
members = ["crates/rfpm", "apps/rfdyno"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rfpm = { path = "crates/rfpm" }
serialport = { version = "4.10", default-features = false, features = ["usbportinfo-interface"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "wayland", "x11"] }
egui = "0.37"
egui_plot = "0.38"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
